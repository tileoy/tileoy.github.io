<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TILE | Creative Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            color: white;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00aaff;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px;

            background:
                radial-gradient(circle at 20% 20%, #123c55, transparent 30%),
                radial-gradient(circle at 80% 80%, #152d50, transparent 30%),
                #0a0a0a;
        }

        .hero small {
            letter-spacing: 5px;
            color: #00aaff;
        }

        .hero h1 {
            font-size: clamp(70px, 15vw, 180px);
            font-weight: 900;
            letter-spacing: -8px;
            margin: 10px 0;
        }

        .hero h1 span {
            color: #00aaff;
        }

        .hero p {
            color: #aaa;
            max-width: 600px;
            margin: auto;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 15px 30px;
            border-radius: 50px;
            background: #00aaff;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-5px);
        }

        /* SECTION */
        section {
            padding: 110px 8%;
        }

        .title {
            font-size: 50px;
            margin-bottom: 50px;
        }

        .title span {
            color: #00aaff;
        }

        /* ABOUT */
        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .about p {
            color: #aaa;
            font-size: 18px;
            line-height: 1.8;
        }

        .info {
            padding: 35px;
            border: 1px solid #222;
            border-radius: 20px;
            background: #111;
        }

        .info h3 {
            color: #00aaff;
            margin-bottom: 10px;
        }

        .info p {
            font-size: 15px;
        }

        /* PORTFOLIO */
        .portfolio {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #222;
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #00aaff;
        }

        .image {
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #123c55, #111);
            font-size: 60px;
        }

        .card-content {
            padding: 25px;
        }

        .card-content h3 {
            margin-bottom: 8px;
        }

        .card-content p {
            color: #888;
            font-size: 14px;
        }

        /* SKILLS */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .skill {
            padding: 15px 25px;
            border: 1px solid #333;
            border-radius: 50px;
            transition: 0.3s;
        }

        .skill:hover {
            background: #00aaff;
            border-color: #00aaff;
        }

        /* CONTACT */
        .contact {
            text-align: center;
        }

        .contact p {
            color: #999;
            margin-bottom: 30px;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social a {
            padding: 13px 25px;
            border: 1px solid #333;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .social a:hover {
            background: #00aaff;
            border-color: #00aaff;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #222;
            color: #666;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            nav {
                padding: 18px 5%;
            }

            nav ul {
                gap: 12px;
            }

            nav a {
                font-size: 12px;
            }

            section {
                padding: 80px 5%;
            }

            .about {
                grid-template-columns: 1fr;
            }

            .portfolio {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 38px;
            }

            .hero h1 {
                letter-spacing: -4px;
            }
        }
    </style>
</head>
